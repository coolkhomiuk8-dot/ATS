<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call Stats Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --green: #16a34a;
    --yellow: #ca8a04;
    --orange: #ea580c;
    --red: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #2c3038;
      --accent: #60a5fa;
      --green: #4ade80;
      --yellow: #facc15;
      --orange: #fb923c;
      --red: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .summary {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; min-width: 140px;
  }
  .stat-card .label { color: var(--muted); font-size: 12px; }
  .stat-card .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .note-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 24px; font-size: 14px; line-height: 1.5;
  }
  .note-card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  h2 {
    font-size: 15px; margin: 24px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 6px;
  }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .card .name { font-weight: 600; font-size: 13px; }
  .card .count { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  canvas { max-height: 90px; }
  #err { color: var(--red); font-size: 13px; }
</style>
</head>
<body>
  <h1>📊 Call Stats Dashboard</h1>
  <div class="meta" id="meta">Завантаження...</div>
  <div id="err"></div>

  <div class="summary" id="summary"></div>
  <div class="note-card" id="note" style="display:none">
    <div class="label">💭 Останні поради</div>
    <div id="noteText"></div>
  </div>

  <div id="accounts"></div>

  <script>
    const REFRESH_MS = 30 * 60 * 1000;
    let chartInstances = [];

    function fmtTime(ts) {
      return new Date(ts).toLocaleString("uk-UA", {
        timeZone: "America/New_York",
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
      });
    }

    // Fixed business target (not relative to the team average) — 50/day is
    // the goal, below 30 is a real problem regardless of how others did.
    const DAILY_TARGET = 50;
    const MIN_ACCEPTABLE = 30;

    function trafficColor(callCount) {
      if (callCount >= DAILY_TARGET) return getComputedStyle(document.documentElement).getPropertyValue("--green");
      if (callCount >= MIN_ACCEPTABLE) return getComputedStyle(document.documentElement).getPropertyValue("--yellow");
      return getComputedStyle(document.documentElement).getPropertyValue("--orange");
    }

    function buildSeries(snapshots, name) {
      return snapshots.map((snap) => {
        const row = snap.stats.find((s) => s.name === name);
        return { x: snap.ts, y: row ? row.callCount : null };
      });
    }

    function render(data) {
      const { snapshots } = data;
      chartInstances.forEach((c) => c.destroy());
      chartInstances = [];

      const errEl = document.getElementById("err");
      errEl.textContent = "";

      if (!snapshots || snapshots.length === 0) {
        document.getElementById("meta").textContent = "Ще немає збережених знімків — перший з'явиться протягом 30 хв.";
        return;
      }

      const latest = snapshots[snapshots.length - 1];
      document.getElementById("meta").textContent = `Останнє оновлення: ${fmtTime(latest.ts)} ET · знімків за тиждень: ${snapshots.length}`;

      const ok = latest.stats;
      const active = ok.filter((s) => s.callCount > 0);
      const zero = ok.filter((s) => s.callCount === 0);
      const metTarget = ok.filter((s) => s.callCount >= DAILY_TARGET);
      const top = ok.reduce((best, s) => (!best || s.callCount > best.callCount ? s : best), null);

      document.getElementById("summary").innerHTML = `
        <div class="stat-card"><div class="label">Активні</div><div class="value">${active.length}/${ok.length}</div></div>
        <div class="stat-card"><div class="label">🎯 Ціль (${DAILY_TARGET})</div><div class="value">${metTarget.length}/${ok.length}</div></div>
        <div class="stat-card"><div class="label">🏆 Лідер</div><div class="value" style="font-size:16px">${top ? top.name + " (" + top.callCount + ")" : "—"}</div></div>
        <div class="stat-card"><div class="label">⚠️ Нулі</div><div class="value">${zero.length}</div></div>
      `;

      const noteCard = document.getElementById("note");
      if (latest.note) {
        noteCard.style.display = "block";
        document.getElementById("noteText").textContent = latest.note;
      } else {
        noteCard.style.display = "none";
      }

      if (latest.errors && latest.errors.length > 0) {
        errEl.textContent = latest.errors.map((e) => `⚠️ ${e.account}: ${e.error}`).join(" · ");
      }

      const byAccount = new Map();
      for (const s of ok) {
        if (!byAccount.has(s.account)) byAccount.set(s.account, []);
        byAccount.get(s.account).push(s);
      }

      const container = document.getElementById("accounts");
      container.innerHTML = "";

      for (const [account, people] of byAccount) {
        people.sort((a, b) => b.callCount - a.callCount);

        const section = document.createElement("div");
        const h2 = document.createElement("h2");
        h2.textContent = account;
        section.appendChild(h2);

        const grid = document.createElement("div");
        grid.className = "grid";

        for (const p of people) {
          const card = document.createElement("div");
          card.className = "card";
          const color = trafficColor(p.callCount);
          card.innerHTML = `
            <div class="top">
              <span class="name"><span class="dot" style="background:${color}"></span>${p.name}</span>
              <span class="count">${p.callCount} (+${p.recentCount}/2г)</span>
            </div>
            <canvas></canvas>
          `;
          grid.appendChild(card);

          const canvas = card.querySelector("canvas");
          const series = buildSeries(snapshots, p.name);
          const chart = new Chart(canvas, {
            type: "line",
            data: {
              datasets: [{
                data: series,
                borderColor: color,
                backgroundColor: color,
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.15,
              }],
            },
            options: {
              responsive: true,
              animation: false,
              plugins: { legend: { display: false }, tooltip: { enabled: true } },
              scales: {
                x: { type: "time", time: { unit: "day" }, display: false },
                y: { display: false, beginAtZero: true },
              },
            },
          });
          chartInstances.push(chart);
        }

        section.appendChild(grid);
        container.appendChild(section);
      }
    }

    async function load() {
      try {
        const res = await fetch("/.netlify/functions/call-stats-history");
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById("err").textContent = "Помилка завантаження: " + e.message;
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
